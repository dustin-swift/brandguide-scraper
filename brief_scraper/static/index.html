<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brief Scraper</title>
<style>
:root {
  --bg: #f6f6f4; --panel: #ffffff; --ink: #16181d; --muted: #6b7080; --line: #e3e4e8; --accent: #e5333d;
  --chip: #eef0f3; --ok: #0a7d55; --warn: #a15c00; --warn-bg: #fff4d9; --check: #d9dbe0; --new: #0b5fa5; --code: #f0f1f4;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #14161a; --panel: #1d2026; --ink: #eceef2; --muted: #9aa0ad; --line: #2e323b; --chip: #2a2e37;
    --ok: #4cc79a; --warn: #f0b860; --warn-bg: #3a2f17; --check: #343944; --new: #7ec8f2; --code: #262a33; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
button, input, select { font: inherit; color: inherit; }
header { display: flex; align-items: center; gap: 16px; padding: 14px 24px; background: #0b0c0f; color: #fff; position: sticky; top: 0; z-index: 5; }
header h1 { font-size: 15px; letter-spacing: .08em; text-transform: uppercase; margin: 0; color: var(--accent); font-weight: 800; cursor: pointer; }
header .crumb { color: #b9bdc8; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 8px 14px; cursor: pointer; font-weight: 600; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.ghost { background: transparent; border-color: #3a3d46; color: #fff; }
.btn.small { padding: 4px 10px; font-weight: 500; }
.btn:disabled { opacity: .5; cursor: default; }
main { padding: 24px; max-width: 1500px; margin: 0 auto; }
h2 { font-size: 22px; margin: 0 0 6px; text-wrap: balance; } h3 { font-size: 15px; margin: 0 0 8px; }
.lede { color: var(--muted); margin: 0 0 20px; max-width: 70ch; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-bottom: 16px; }
.cols { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.field { display: grid; gap: 4px; margin-bottom: 10px; } .field span { color: var(--muted); font-size: 12.5px; }
input[type=text], input[type=url], input[type=search], select { border: 1px solid var(--line); border-radius: 8px; background: var(--bg); padding: 8px 10px; min-width: 0; }
.steps { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 20px; }
.steps button { border: 1px solid var(--line); background: var(--panel); border-radius: 99px; padding: 7px 16px; cursor: pointer; font-weight: 600; }
.steps button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.steps button small { font-weight: 500; opacity: .7; margin-left: 6px; }
.drop { border: 2px dashed var(--line); border-radius: 14px; background: var(--panel); padding: 30px 24px; text-align: center; }
.drop.over { border-color: var(--accent); } .drop strong { display: block; font-size: 16px; margin-bottom: 6px; }
.rowline { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.src { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); } .src:first-child { border-top: 0; }
.src .name { flex: 1; min-width: 0; overflow-wrap: anywhere; font-weight: 600; } .src .meta { font-weight: 400; }
.notice { background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 10px 14px; margin-bottom: 16px; }
.cmd { background: var(--code); border-radius: 8px; padding: 10px 14px; font: 14px ui-monospace, SFMono-Regular, Menlo, monospace; display: inline-flex; gap: 14px; align-items: center; margin: 6px 0; }
.stat { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
.stat div { background: var(--bg); border-radius: 10px; padding: 12px; } .stat b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
.layout { display: grid; grid-template-columns: 210px 1fr; gap: 24px; align-items: start; }
nav { position: sticky; top: 76px; display: grid; gap: 2px; }
nav button { display: flex; justify-content: space-between; gap: 8px; text-align: left; border: 0; background: transparent; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
nav button.on { background: var(--ink); color: var(--bg); font-weight: 700; }
nav button span { color: var(--muted); font-variant-numeric: tabular-nums; } nav button.on span { color: inherit; opacity: .7; }
nav button.empty { opacity: .45; }
.tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 16px; } .tools input[type=search] { flex: 1; min-width: 160px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.grid.wide { grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
.card.off { opacity: .55; }
.pre { height: 110px; display: grid; place-items: center; border-bottom: 1px solid var(--line); overflow: hidden; }
.pre.art { background-color: var(--panel); background-image: linear-gradient(45deg, var(--check) 25%, transparent 25%, transparent 75%, var(--check) 75%), linear-gradient(45deg, var(--check) 25%, transparent 25%, transparent 75%, var(--check) 75%); background-size: 16px 16px; background-position: 0 0, 8px 8px; }
.pre img { max-width: 88%; max-height: 92px; object-fit: contain; }
.pre.split { grid-template-columns: 1fr 1fr; place-items: stretch; } .pre.split div { display: grid; place-items: end start; padding: 6px 8px; font-size: 11px; color: #fff; text-shadow: 0 0 3px #000; }
.body { padding: 12px; display: grid; gap: 8px; flex: 1; align-content: start; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row input[type=text] { flex: 1; min-width: 120px; border-color: transparent; background: transparent; font-weight: 700; padding: 4px 6px; border-radius: 6px; }
.row input[type=text]:hover, .row input[type=text]:focus { border-color: var(--line); background: var(--bg); outline: none; }
.card select { padding: 4px 6px; border-radius: 6px; max-width: 100%; }
.meta { color: var(--muted); font-size: 12.5px; overflow-wrap: anywhere; } .meta code { font: 12px ui-monospace, Menlo, monospace; color: var(--ink); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--chip); border-radius: 99px; padding: 2px 8px; font-size: 11.5px; border: 0; color: inherit; }
button.chip { cursor: pointer; text-decoration: underline; }
.chip.exact, .chip.same { color: var(--ok); } .chip.estimated, .chip.approximate, .chip.changed { color: var(--warn); } .chip.new { color: var(--new); }
.props { margin: 0; padding: 0; list-style: none; font-size: 12.5px; display: grid; gap: 2px; }
.roles { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
.roles .dot, .dot { width: 14px; height: 14px; border-radius: 4px; border: 1px solid var(--line); display: inline-block; vertical-align: -2px; }
.plan li { margin: 6px 0; } .plan .ok { color: var(--ok); } .plan .bad { color: var(--warn); }
dialog { border: 0; border-radius: 12px; padding: 0; max-width: min(1200px, 94vw); background: var(--panel); color: var(--ink); }
dialog::backdrop { background: rgba(0,0,0,.6); } dialog img { display: block; max-width: 100%; max-height: 82vh; }
dialog .cap { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; }
@media (max-width: 760px) { .layout { grid-template-columns: 1fr; } nav { position: static; grid-auto-flow: column; overflow-x: auto; } main { padding: 16px; } }
</style>
</head>
<body>
<header><h1 id="home">Brief Scraper</h1><div class="crumb" id="crumb"></div></header>
<main id="main"></main>
<dialog id="pageDialog"><div class="cap"><strong id="pageCap"></strong><button class="btn" id="pageClose">Close</button></div><img id="pageImg" alt=""></dialog>
<script>
const TABS = [["color","Colours"],["gradient","Gradients"],["text-style","Text styles"],["logo","Logos"],["icon","Icons"],["image","Images"],
  ["graphic","Graphics"],["font-family","Font families"],["component","Components"],["guideline","Guidelines"],["effect","Effects"],["spacing","Spacing"],["radius","Radii"],["motion","Motion"]];
const ASSET_TYPES = ["icon","logo","image","graphic"], ROLES = ["primary","secondary","tertiary","text","background"];
const STATUS = { new: "New", changed: "Differs from the board", same: "Already on the board", "same-value": "Same value as", reference: "Reference only" };
const $ = id => document.getElementById(id);
const S = { info: null, brand: null, data: null, step: "materials", tab: "color", q: "", edits: {}, actions: {}, roles: {}, textTargets: {}, logoSlots: {}, fontFallback: "", stamp: "", timer: null };

function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === "class") el.className = v; else if (k === "style") Object.assign(el.style, v);
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, ""); else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const kid of kids.flat(3)) if (kid != null && kid !== false) el.append(kid);
  return el;
}
const api = async (path, opts) => { const r = await fetch(path, opts); return r.json(); };
const post = (path, body) => api(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
const cur = el => ({ name: el.name, type: el.type, ...(S.edits[el.id] || {}) });
const cmp = el => (S.data.compared || {})[el.id] || { status: S.data.board ? "new" : null, writable: !["component","guideline","font-family","effect","spacing","radius","motion"].includes(el.type) };
const defaultAction = el => { const c = cmp(el); if (!c.writable) return "none"; if (!el.include) return "ignore"; return c.status === "changed" ? "replace" : c.status === "new" ? "add" : "ignore"; };
const action = el => S.actions[el.id] || defaultAction(el);
const copy = t => navigator.clipboard && navigator.clipboard.writeText(t);
const cmd = text => h("div", { class: "cmd" }, text, h("button", { class: "btn small", onclick: e => { copy(text); e.target.textContent = "Copied"; } }, "Copy"));

// ------------------------------------------------------------------------------------ brands
async function home() {
  clearInterval(S.timer); S.brand = null; $("crumb").textContent = "";
  S.info = await api("/api/brands");
  const name = h("input", { type: "text", placeholder: "For example: ABRYSVO" }), url = h("input", { type: "url", placeholder: "https://www.figma.com/design/…" });
  const err = h("div", { class: "meta", style: { color: "var(--warn)" } });
  const add = async () => { const r = await post("/api/brands", { name: name.value, figma_url: url.value }); if (r.error) err.textContent = r.error; else open(r.id); };
  $("main").replaceChildren(
    h("h2", {}, "Brands"),
    h("p", { class: "lede" }, "A brand is a name and the Figma file its design system lives in. Open one to add materials, compare them with what is on the board, and approve what gets written."),
    !S.info.ai_available && h("div", { class: "notice" }, "No ANTHROPIC_API_KEY found, so the Claude pass is off: labelled colours, gradients, fonts and artwork are still read from PDFs, but naming, components, websites and ads are not. Add the key to a .env file next to run.sh and restart."),
    h("div", { class: "cols" },
      S.info.brands.map(b => h("div", { class: "panel" }, h("h3", {}, b.name), h("div", { class: "meta" }, b.figma_url),
        h("div", { class: "rowline", style: { marginTop: "12px" } }, h("button", { class: "btn primary", onclick: () => open(b.id) }, "Open"),
          h("button", { class: "btn", onclick: async () => { if (confirm(`Remove ${b.name} from this list? The Figma file is not touched.`)) { await api("/api/brands/" + b.id, { method: "DELETE" }); home(); } } }, "Remove")))),
      h("div", { class: "panel" }, h("h3", {}, "Add a brand"),
        h("label", { class: "field" }, h("span", {}, "Brand name"), name), h("label", { class: "field" }, h("span", {}, "Figma file link"), url), err,
        h("button", { class: "btn primary", onclick: add }, "Add brand"))));
}

async function open(id) {
  Object.assign(S, { brand: id, step: "materials", edits: {}, actions: {}, roles: {}, textTargets: {}, logoSlots: {}, stamp: "" });
  await refresh(true);
  clearInterval(S.timer); S.timer = setInterval(() => refresh(false), 1500);
}

async function refresh(force) {
  if (!S.brand) return;
  const d = await api("/api/brands/" + S.brand);
  const stamp = JSON.stringify([d.sources.map(s => [s.id, s.state, s.message, s.count]), d.scanned_at, d.scan_running, d.plan && d.plan.steps.map(s => s.result && s.result.at), d.elements.length, d.runner && [d.runner.state, d.runner.problem, (d.runner.log || []).length]]);
  const busy = document.activeElement && ["INPUT", "SELECT"].includes(document.activeElement.tagName);
  if (!force && (stamp === S.stamp || busy)) return;
  S.data = d; S.stamp = stamp; $("crumb").textContent = d.brand.name;
  if (!TABS.some(([t]) => t === S.tab && d.elements.some(e => cur(e).type === t))) S.tab = (TABS.find(([t]) => d.elements.some(e => cur(e).type === t)) || TABS[0])[0];
  render();
}

function render() {
  const d = S.data, running = d.sources.filter(s => s.state === "running").length;
  const changes = d.elements.filter(e => ["add", "replace"].includes(action(e))).length;
  const steps = [["materials", "1 Materials", d.sources.length ? `${d.elements.length} items` : ""], ["board", "2 Figma board", d.scanned_at ? "scanned " + d.scanned_at.slice(11) : "not scanned"],
    ["review", "3 Review", d.elements.length ? `${changes} to write` : ""], ["apply", "4 Apply", d.plan ? `${d.plan.steps.filter(s => s.result).length}/${d.plan.steps.length}` : ""]];
  const view = { materials, board, review, apply }[S.step]();
  $("main").replaceChildren(h("div", { class: "steps" }, steps.map(([k, label, sub]) => h("button", { class: k === S.step ? "on" : "", onclick: () => { S.step = k; render(); } }, label, sub && h("small", {}, sub)))), view);
}

// --------------------------------------------------------------------------------- materials
function materials() {
  const d = S.data, ai = S.info.ai_available;
  const useAi = h("input", { type: "checkbox", id: "useAi", checked: ai, disabled: !ai }), ref = h("input", { type: "checkbox", id: "isRef", disabled: !ai });
  const send = async (files, url) => {
    const fd = new FormData();
    for (const f of files || []) fd.append("files", f, f.webkitRelativePath || f._path || f.name);
    if (url) fd.append("url", url);
    fd.append("use_ai", useAi.checked ? "1" : "0"); fd.append("reference", ref.checked ? "1" : "0");
    const r = await api(`/api/brands/${S.brand}/sources`, { method: "POST", body: fd });
    if (r.unsupported && r.unsupported.length) alert("Skipped (not a PDF, image, SVG or text file):\n" + r.unsupported.slice(0, 15).join("\n"));
    refresh(true);
  };
  // dropped folders arrive as directory entries; walk them so every file keeps its path
  const walk = async entry => entry.isFile ? [await new Promise(res => entry.file(f => { f._path = entry.fullPath.replace(/^\//, ""); res(f); }))]
    : (await Promise.all((await new Promise(res => { const out = [], rd = entry.createReader(); const more = () => rd.readEntries(b => b.length ? (out.push(...b), more()) : res(out)); more(); })).map(walk))).flat();
  const pickFiles = h("input", { type: "file", multiple: true, hidden: true, onchange: e => send([...e.target.files]) });
  const pickDir = h("input", { type: "file", webkitdirectory: true, hidden: true, onchange: e => send([...e.target.files]) });
  const drop = h("div", { class: "drop", ondragover: e => { e.preventDefault(); drop.classList.add("over"); }, ondragleave: () => drop.classList.remove("over"),
    ondrop: async e => { e.preventDefault(); drop.classList.remove("over");
      const entries = [...e.dataTransfer.items].map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
      send(entries.length ? (await Promise.all(entries.map(walk))).flat() : [...e.dataTransfer.files]); } },
    h("strong", {}, "Drop brand PDFs, asset folders, images, SVGs or text files here"),
    h("div", { class: "rowline", style: { justifyContent: "center" } }, h("button", { class: "btn", onclick: () => pickFiles.click() }, "Choose files"), h("button", { class: "btn", onclick: () => pickDir.click() }, "Choose a folder")), pickFiles, pickDir);
  const url = h("input", { type: "url", placeholder: "https://brand-site.example.com", style: { flex: 1 } });
  return h("div", {},
    h("h2", {}, "Materials for " + d.brand.name),
    h("p", { class: "lede" }, "Add whatever you have. Each source is broken down into individual colours, gradients, type styles, logos, icons and images. Nothing is stored; materials are held only while this app is running."),
    drop,
    h("div", { class: "panel", style: { marginTop: "16px" } },
      h("div", { class: "rowline" }, url, h("button", { class: "btn", disabled: !ai, onclick: () => url.value && send(null, url.value) }, "Read website")),
      !ai && h("div", { class: "meta" }, "Reading a website needs the Claude pass."),
      h("label", { class: "rowline", style: { marginTop: "12px" } }, useAi, h("span", {}, "Use Claude to name and sort assets and read components, rules and text files", h("div", { class: "meta" }, ai ? `Sends page images and text to the Claude API (${S.info.model}).` : "Off: no API key."))),
      h("label", { class: "rowline", style: { marginTop: "8px" } }, ref, h("span", {}, "The images I add next are ads or layouts", h("div", { class: "meta" }, "They are read as evidence of colours and type in use, marked as estimates and left out by default. They are not added to the image library.")))),
    h("div", { class: "panel" }, h("h3", {}, "Sources"),
      d.sources.length ? d.sources.map(s => h("div", { class: "src" },
        h("div", { class: "name" }, s.name, h("div", { class: "meta" }, s.state === "running" ? (s.message || "Working") : s.state === "error" ? "Could not read this: " + s.message : `${s.count} new item${s.count === 1 ? "" : "s"}` + (s.note ? " · " + s.note : "") + (s.skipped ? ` · ${s.skipped.length} file(s) skipped: ${s.skipped.slice(0, 3).join("; ")}` : ""))),
        h("span", { class: "chip " + (s.state === "done" ? "same" : s.state === "error" ? "changed" : "") }, s.state),
        s.state !== "running" && h("button", { class: "btn small", onclick: async () => { await api(`/api/brands/${S.brand}/sources/${s.id}`, { method: "DELETE" }); refresh(true); } }, "Remove")))
        : h("div", { class: "meta" }, "Nothing added yet.")),
    d.elements.length > 0 && h("button", { class: "btn primary", onclick: () => { S.step = d.scanned_at ? "review" : "board"; render(); } }, d.scanned_at ? "Review against the board" : "Next: scan the Figma board"));
}

// A button that has Claude Code do the work in the background, with the typed command as a fallback.
function runBox(kind, label, command, disabled) {
  const r = S.data.runner || {}, mine = r.kind === kind, running = mine && r.state === "running";
  const go = async () => { const out = await post(`/api/brands/${S.brand}/run/${kind}`); if (out.error) alert(out.error); refresh(true); };
  return h("div", {},
    h("div", { class: "rowline" },
      h("button", { class: "btn primary", disabled: disabled || running || !r.available, onclick: go }, running ? "Working…" : label),
      running && h("button", { class: "btn", onclick: async () => { await post(`/api/brands/${S.brand}/run/stop`); refresh(true); } }, "Stop"),
      running && h("span", { class: "meta" }, `Claude Code started at ${r.started}. This usually takes a minute or two.`)),
    !r.available && h("div", { class: "notice", style: { marginTop: "10px" } }, r.hint),
    mine && r.problem && h("div", { class: "notice", style: { marginTop: "10px" } }, r.problem),
    mine && r.log && r.log.length > 0 && (running || r.problem) && h("ul", { class: "props", style: { marginTop: "8px" } }, r.log.slice(-6).map(l => h("li", { class: "meta" }, l))),
    h("details", { style: { marginTop: "12px" } }, h("summary", { class: "meta" }, "Or run it yourself in Claude Code"),
      h("div", { class: "meta", style: { marginTop: "6px" } }, "With this folder open in Claude Code, run:"), cmd(command)));
}

// ------------------------------------------------------------------------------------- board
function board() {
  const d = S.data, b = d.board;
  return h("div", {},
    h("h2", {}, "The Figma board as it is now"),
    h("p", { class: "lede" }, "Every session starts from a fresh scan, because the board is the record and can change between sessions. The scan only reads; it changes nothing."),
    h("div", { class: "panel" }, h("h3", {}, d.scanned_at ? "Scan again any time" : "Scan the board"),
      runBox("scan", d.scanned_at ? "Scan the Figma board again" : "Scan the Figma board", "/scan-brand"),
      h("div", { class: "meta", style: { marginTop: "10px" } }, d.scan_running ? "Scan in progress…" : d.scanned_at ? `Last scanned ${d.scanned_at}.` : "Claude Code reads the file through its Figma connection and sends the result here."),
      h("div", { class: "meta" }, h("a", { href: d.brand.figma_url, target: "_blank", rel: "noopener" }, "Open the Figma file"))),
    b && h("div", { class: "panel" }, h("h3", {}, b.file || "Figma file"),
      h("div", { class: "stat" }, [["Colours", b.colours], ["Gradients", b.gradients], ["Text styles", b.text_styles], ["Icons", b.icons], ["Images", b.visuals], ["Logo sets", b.logo_sets.length]].map(([k, v]) => h("div", {}, h("b", {}, v), k))),
      h("div", { class: "meta", style: { marginTop: "12px" } }, "Colour roles: ", ROLES.map(r => [h("span", { class: "dot", style: { background: b.roles[r] || "transparent" } }), ` ${r} ${b.roles[r] || "not set"}   `])),
      ["logos", "visuals", "icons"].filter(k => !b.pages_found.includes(k)).map(k => h("div", { class: "notice", style: { marginTop: "12px" } }, `No ${k} page was found in this file, so ${k} cannot be placed.`))),
    b && d.elements.length > 0 && h("button", { class: "btn primary", onclick: () => { S.step = "review"; render(); } }, "Review new material against this"));
}

// ------------------------------------------------------------------------------------ review
function review() {
  const d = S.data, b = d.board;
  if (!d.elements.length) return h("div", { class: "panel" }, "Add materials first.");
  const typeOf = e => cur(e).type;
  const nav = h("nav", {}, TABS.map(([t, label]) => { const all = d.elements.filter(e => typeOf(e) === t), on = all.filter(e => ["add", "replace"].includes(action(e))).length;
    return all.length ? h("button", { class: t === S.tab ? "on" : "", onclick: () => { S.tab = t; render(); } }, label, h("span", {}, `${on}/${all.length}`)) : null; }));
  const q = S.q.toLowerCase();
  const list = d.elements.filter(e => typeOf(e) === S.tab).filter(e => !q || (cur(e).name + " " + (e.section || "") + " " + (e.hex || "") + " " + (e.source_name || "")).toLowerCase().includes(q));

function preview(el, c) {

      b.texts.map(t => h("option", { value: t.n, selected: S.textTargets[el.id] === t.n }, `replace ${t.n} (${t.f} ${t.s} ${t.z})`)))));

      b.logo_slots.map(s => h("option", { value: s, selected: S.logoSlots[el.id] === s }, "replace " + s.replace("|", " · "))))));

    preview(el, c),

        ASSET_TYPES.includes(el.type) && h("select", { "aria-label": "Kind", onchange: ev => { S.edits[el.id] = { ...(S.edits[el.id] || {}), type: ev.target.value }; S.tab = ev.target.value; render(); } }, ASSET_TYPES.map(t => h("option", { value: t, selected: t === e.type }, t)))),

function apply() {
