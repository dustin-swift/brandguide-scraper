<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Northwind Brand Guidelines (probe site)</title>
<meta name="description" content="Northwind brand system: logos, colours, typography, imagery and icons.">
<meta property="og:image" content="assets/visual-01.png"><link rel="icon" href="assets/logo-primary.svg">
<style>
:root{--color-harbor-blue:#0B5FA5;--color-deep-navy:#0A2540;--color-signal-yellow:#F2B705;--color-berry:#C2255C;--color-mist:#E6F0F8;--color-slate:#3A4654;--color-sea-green:#1A8F78;--color-coral:#E8623A;--color-sand:#F4E9D8;--color-graphite:#1E1E1E;--color-lilac:#8A6FD1;--color-sky:#7EC8F2;--color-primary:#0B5FA5;--color-secondary:#0A2540;--color-accent:#F2B705;--color-text:#1E1E1E;--color-background:#FFFFFF;
--gradient-harbor:linear-gradient(90deg,#0B5FA5 0%,#0A2540 100%);--gradient-sunrise:linear-gradient(90deg,#F2B705 0%,#C2255C 100%);--radius-card:16px;--shadow-card:0 8px 24px rgba(10,37,64,.18)}
body{margin:0;font-family:Georgia,"Times New Roman",serif;color:var(--color-text);background:var(--color-background);line-height:1.5}
header{display:flex;align-items:center;gap:24px;padding:20px 40px;border-bottom:1px solid #ddd} header img{height:56px}
main{max-width:1200px;margin:0 auto;padding:24px 40px 80px}
h1{font-family:"Trebuchet MS",Arial,sans-serif;font-size:56px;font-weight:700;line-height:1.1;margin:32px 0 8px;color:var(--color-secondary)}
h2{font-family:"Trebuchet MS",Arial,sans-serif;font-size:32px;font-weight:700;margin:56px 0 16px;color:var(--color-primary)}
p{font-size:18px} .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px}
figure{margin:0} figure img{width:100%;border-radius:var(--radius-card);display:block} figcaption{font:14px Arial,sans-serif;margin-top:6px}
.sw{height:110px;border-radius:var(--radius-card);box-shadow:var(--shadow-card)} .logos figure{background:#f3f5f7;padding:24px;border-radius:var(--radius-card)} .logos .dark{background:#0A2540}
.icons{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))} .icons img{width:64px;height:64px;border-radius:0}
.btn{display:inline-block;background:var(--color-primary);color:#fff;font:700 16px "Trebuchet MS",Arial,sans-serif;padding:14px 28px;border-radius:999px;text-decoration:none}
.hero{background:var(--gradient-harbor);color:#fff;border-radius:24px;padding:48px;margin-top:24px} .hero h1{color:#fff;margin-top:0}
</style></head><body>
<header><img class="logo" id="logo" src="assets/logo-primary.svg" alt="Northwind logo"><nav>Brand Guidelines</nav></header>
<main>
<section class="hero"><h1>Northwind Brand Guidelines</h1><p>A fictional brand used to test design-system ingestion.</p><a class="btn" href="#logos">View the logos</a></section>
<section id="logos"><h2>Logos</h2><div class="grid logos">
<figure><img src="assets/logo-primary.svg" alt="Northwind logo primary"><figcaption>Logo A: Primary (SVG)</figcaption></figure>
<figure><img src="assets/logo-black.svg" alt="Northwind logo black"><figcaption>Logo B: Black (SVG)</figcaption></figure>
<figure class="dark"><img src="assets/logo-reversed.svg" alt="Northwind logo reversed"><figcaption style="color:#fff">Logo C: Reversed (SVG)</figcaption></figure>
<figure><img src="assets/logo-accent.svg" alt="Northwind logo accent"><figcaption>Logo D: Accent (SVG)</figcaption></figure>
<figure><img src="assets/logo-primary.png" alt="Northwind logo PNG"><figcaption>Logo E: Primary (PNG)</figcaption></figure></div></section>
<section id="colours"><h2>Colours</h2><div class="grid"><figure><div class="sw" style="background:#0B5FA5"></div><figcaption><strong>Harbor Blue</strong><br>#0B5FA5</figcaption></figure><figure><div class="sw" style="background:#0A2540"></div><figcaption><strong>Deep Navy</strong><br>#0A2540</figcaption></figure><figure><div class="sw" style="background:#F2B705"></div><figcaption><strong>Signal Yellow</strong><br>#F2B705</figcaption></figure><figure><div class="sw" style="background:#C2255C"></div><figcaption><strong>Berry</strong><br>#C2255C</figcaption></figure><figure><div class="sw" style="background:#E6F0F8"></div><figcaption><strong>Mist</strong><br>#E6F0F8</figcaption></figure><figure><div class="sw" style="background:#3A4654"></div><figcaption><strong>Slate</strong><br>#3A4654</figcaption></figure><figure><div class="sw" style="background:#1A8F78"></div><figcaption><strong>Sea Green</strong><br>#1A8F78</figcaption></figure><figure><div class="sw" style="background:#E8623A"></div><figcaption><strong>Coral</strong><br>#E8623A</figcaption></figure><figure><div class="sw" style="background:#F4E9D8"></div><figcaption><strong>Sand</strong><br>#F4E9D8</figcaption></figure><figure><div class="sw" style="background:#1E1E1E"></div><figcaption><strong>Graphite</strong><br>#1E1E1E</figcaption></figure><figure><div class="sw" style="background:#8A6FD1"></div><figcaption><strong>Lilac</strong><br>#8A6FD1</figcaption></figure><figure><div class="sw" style="background:#7EC8F2"></div><figcaption><strong>Sky</strong><br>#7EC8F2</figcaption></figure></div>
<h2>Gradients</h2><div class="grid"><figure><div class="sw" style="background:var(--gradient-harbor)"></div><figcaption><strong>Harbor gradient</strong><br>linear-gradient(90deg, #0B5FA5, #0A2540)</figcaption></figure><figure><div class="sw" style="background:var(--gradient-sunrise)"></div><figcaption><strong>Sunrise gradient</strong><br>linear-gradient(90deg, #F2B705, #C2255C)</figcaption></figure></div></section>
<section id="typography"><h2>Typography</h2><p>Headlines are set in Trebuchet MS Bold. Body copy is set in Georgia Regular, 18px.</p></section>
<section id="imagery"><h2>Imagery</h2><div class="grid"><figure><img src="assets/visual-01.png" alt="Northwind key visual 01"><figcaption>Visual 01</figcaption></figure><figure><img src="assets/visual-02.png" alt="Northwind key visual 02"><figcaption>Visual 02</figcaption></figure><figure><img src="assets/visual-03.png" alt="Northwind key visual 03"><figcaption>Visual 03</figcaption></figure><figure><img src="assets/visual-04.png" alt="Northwind key visual 04"><figcaption>Visual 04</figcaption></figure><figure><img src="assets/visual-05.png" alt="Northwind key visual 05"><figcaption>Visual 05</figcaption></figure><figure><img src="assets/visual-06.png" alt="Northwind key visual 06"><figcaption>Visual 06</figcaption></figure><figure><img src="assets/visual-07.png" alt="Northwind key visual 07"><figcaption>Visual 07</figcaption></figure><figure><img src="assets/visual-08.png" alt="Northwind key visual 08"><figcaption>Visual 08</figcaption></figure><figure><img src="assets/visual-09.png" alt="Northwind key visual 09"><figcaption>Visual 09</figcaption></figure><figure><img src="assets/visual-10.png" alt="Northwind key visual 10"><figcaption>Visual 10</figcaption></figure><figure><img src="assets/visual-11.png" alt="Northwind key visual 11"><figcaption>Visual 11</figcaption></figure><figure><img src="assets/visual-12.png" alt="Northwind key visual 12"><figcaption>Visual 12</figcaption></figure></div></section>
<section id="icons"><h2>Icons</h2><div class="grid icons"><figure><img src="assets/icon-circle.svg" alt="circle icon"><figcaption>Icon: circle</figcaption></figure><figure><img src="assets/icon-square.svg" alt="square icon"><figcaption>Icon: square</figcaption></figure><figure><img src="assets/icon-triangle.svg" alt="triangle icon"><figcaption>Icon: triangle</figcaption></figure><figure><img src="assets/icon-plus.svg" alt="plus icon"><figcaption>Icon: plus</figcaption></figure><figure><img src="assets/icon-check.svg" alt="check icon"><figcaption>Icon: check</figcaption></figure><figure><img src="assets/icon-close.svg" alt="close icon"><figcaption>Icon: close</figcaption></figure><figure><img src="assets/icon-user.svg" alt="user icon"><figcaption>Icon: user</figcaption></figure><figure><img src="assets/icon-mail.svg" alt="mail icon"><figcaption>Icon: mail</figcaption></figure><figure><img src="assets/icon-download.svg" alt="download icon"><figcaption>Icon: download</figcaption></figure><figure><img src="assets/icon-search.svg" alt="search icon"><figcaption>Icon: search</figcaption></figure><figure><img src="assets/icon-heart.svg" alt="heart icon"><figcaption>Icon: heart</figcaption></figure><figure><img src="assets/icon-home.svg" alt="home icon"><figcaption>Icon: home</figcaption></figure></div></section>
</main></body></html>
